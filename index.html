<style>
:root{
  --bg:#e9e7e3; --bg2:#dedbd5; --card:#f3f2ef; --ink:#0d0d0d; --mute:#6c6a66; --line:rgba(13,13,13,.14);
  --f-big:"Archivo Black", "Arial Black", sans-serif; --f:"Archivo", system-ui, sans-serif;
  --pad:clamp(16px,4vw,56px); --max:1400px; --r:22px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f); font-weight:400; font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; overflow-x:clip}
img{display:block; max-width:100%}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit}
.wrap{max-width:var(--max); margin:0 auto; padding:0 var(--pad)}
.cap{font-size:11.5px; letter-spacing:.22em; text-transform:uppercase; font-weight:500}
.mute{color:var(--mute)}
h1,h2,h3{font-family:var(--f-big); font-weight:400; text-transform:uppercase; line-height:.95; letter-spacing:-.01em; margin:0}

/* header */
.hd{position:sticky; top:0; z-index:40; background:rgba(233,231,227,.9); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.hd-in{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; height:64px; gap:12px}
.hd nav{display:flex; gap:clamp(14px,2.4vw,34px)}
.hd nav.r{justify-content:flex-end}
.hd a.n,.hd button.n{all:unset; display:inline-flex; align-items:center; cursor:pointer; font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; font-weight:500; padding:8px 0; position:relative}
.hd a.n::after,.hd button.n::after{content:""; position:absolute; left:0; right:0; bottom:3px; height:1px; background:var(--ink); scale:0 1; transition:scale .3s; transform-origin:left}
.hd a.n:hover::after,.hd a.n.on::after,.hd button.n:hover::after{scale:1 1}
.logo{font-family:var(--f-big); font-size:30px; letter-spacing:-.02em; line-height:1}
.burger{all:unset; display:none; cursor:pointer; font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; font-weight:600}
.count{display:inline-grid; place-items:center; min-width:20px; height:20px; border-radius:99px; background:var(--ink); color:var(--bg); font-size:10px; letter-spacing:0; margin-left:4px; transition:scale .3s}
.count.pop{animation:pop .4s}
@keyframes pop{50%{scale:1.4}}
@media (max-width:860px){
  .hd-in{grid-template-columns:auto 1fr auto}
  .hd nav.l{display:none} .burger{display:block}
  .hd nav.r .n:not(.cart){display:none}
  .logo{text-align:center}
  .mnav{display:block}
}
.mnav{display:none; position:fixed; inset:64px 0 auto; z-index:39; background:var(--bg); border-bottom:1px solid var(--line); padding:8px var(--pad) 20px; translate:0 -110%; transition:translate .35s}
.mnav.open{translate:0 0}
.mnav a{display:block; font-family:var(--f-big); text-transform:uppercase; font-size:34px; padding:6px 0}

/* buttons */
.btn{all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:15px 26px 14px; border:1.5px solid var(--ink); border-radius:999px;
  font-size:11.5px; letter-spacing:.22em; text-transform:uppercase; font-weight:600; transition:background .25s, color .25s; text-align:center}
.btn:hover{background:var(--ink); color:var(--bg)}
.btn.fill{background:var(--ink); color:var(--bg)} .btn.fill:hover{background:transparent; color:var(--ink)}
.btn:focus-visible,.chip:focus-visible,.pcard:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
.btn.sm{padding:10px 16px 9px; font-size:10.5px}
.btn.added{background:var(--ink); color:var(--bg)}

/* home */
.hero{padding-top:clamp(24px,5vh,56px)}
.hero-t{display:grid; grid-template-columns:1.5fr 1fr; gap:30px; align-items:end; padding-bottom:clamp(20px,4vh,40px)}
.hero h1{font-size:clamp(52px,10.4vw,176px); line-height:.82}
.hero p{margin:0 0 18px; max-width:380px; font-size:17px}
.hero-img{border-radius:var(--r); overflow:hidden; background:#f1f0ee; aspect-ratio:16/7.2}
.hero-img img{width:100%; height:100%; object-fit:cover; object-position:50% 70%}
@media (max-width:760px){ .hero-t{grid-template-columns:1fr} .hero-img{aspect-ratio:4/3} }

.sec{padding:clamp(70px,12vh,140px) 0}
.split{display:grid; grid-template-columns:1fr 1fr; gap:clamp(24px,5vw,80px); align-items:center}
.split .ph{border-radius:var(--r); overflow:hidden; aspect-ratio:4/5; background:var(--card)}
.split .ph img{width:100%; height:100%; object-fit:cover}
.split h2{font-size:clamp(34px,4.4vw,66px); margin:12px 0 18px}
.split p{margin:0 0 12px; max-width:520px}
.contrast{display:grid; grid-template-columns:auto auto auto; gap:6px 18px; margin:22px 0 26px; font-family:var(--f-big); text-transform:uppercase; font-size:clamp(16px,1.6vw,22px)}
.contrast span:nth-child(3n+2){color:var(--mute); font-family:var(--f)}
@media (max-width:860px){ .split{grid-template-columns:1fr} .split.rev .ph{order:-1} }

.big-line{font-size:clamp(40px,8.6vw,150px); line-height:.86; text-align:center}
.big-line em{font-style:normal; -webkit-text-stroke:2px var(--ink); color:transparent}
.marq{overflow:hidden; border-block:1px solid var(--line); padding:16px 0}
.marq-in{display:flex; gap:48px; width:max-content; animation:mq 32s linear infinite}
.marq span{font-family:var(--f-big); text-transform:uppercase; font-size:clamp(22px,3vw,40px); white-space:nowrap}
.marq span::after{content:"·"; margin-left:48px; color:var(--mute)}
@keyframes mq{to{translate:-50% 0}}

.philo{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(14px,2vw,26px); margin-top:clamp(30px,5vh,56px)}
.philo article{background:var(--card); border-radius:var(--r); padding:clamp(20px,2.4vw,32px)}
.philo h3{font-size:clamp(20px,1.9vw,28px); margin-bottom:12px}
.philo p{margin:0; color:#3b3a38}
@media (max-width:860px){ .philo{grid-template-columns:1fr} }

.mood{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.mood div{border-radius:var(--r); overflow:hidden; aspect-ratio:3/4}
.mood div:nth-child(1){grid-row:span 2; aspect-ratio:auto}
.mood img{width:100%; height:100%; object-fit:cover; transition:scale .8s}
.mood div:hover img{scale:1.04}
@media (max-width:700px){ .mood{grid-template-columns:1fr 1fr} .mood div:nth-child(1){grid-row:auto; aspect-ratio:3/4} }

/* product cards */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:clamp(10px,1.6vw,20px)}
.pcard{all:unset; cursor:pointer; display:flex; flex-direction:column; background:var(--card); border-radius:var(--r); padding:16px 16px 18px; position:relative; transition:translate .3s, box-shadow .3s}
.pcard:hover{translate:0 -4px; box-shadow:0 24px 40px -28px rgba(0,0,0,.45)}
.pcard .pi{position:relative; aspect-ratio:1; overflow:hidden; background:radial-gradient(circle at 50% 60%, #fff 0, var(--card) 70%); border-radius:14px}
.pcard .pi img{position:absolute; inset:9%; width:82%; height:82%; max-width:none; object-fit:contain; filter:drop-shadow(0 20px 18px rgba(0,0,0,.16)); transition:scale .5s}
.pcard:hover .pi img{scale:1.05}
.pcard .pt{display:flex; min-height:2.4em; justify-content:space-between; gap:10px; margin-top:14px; align-items:baseline}
.pcard h3{font-size:15px; line-height:1.1}
.pcard .pr{font-weight:600; white-space:nowrap}
.pcard p{margin:8px 0 14px; font-size:14px; color:var(--mute); line-height:1.45}
.pcard .no{position:absolute; top:16px; left:20px; font-size:11px; letter-spacing:.2em; color:var(--mute)}
.pcard .add{margin-top:auto; align-self:flex-start}
.grid.g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:600px){ .grid,.grid.g3{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
  .pcard{padding:10px 10px 12px; border-radius:16px} .pcard .pt{flex-direction:column; gap:2px; min-height:0} .pcard h3{font-size:12.5px}
  .pcard p{font-size:12.5px; margin:6px 0 10px} .pcard .no{top:10px; left:12px} .pcard .add{padding:9px 12px 8px; font-size:9.5px; letter-spacing:.14em} }
@media (max-width:900px){ .grid.g3{grid-template-columns:repeat(2,1fr)} }
.shop-h{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:26px}
.shop-h h1{font-size:clamp(44px,8vw,130px); line-height:.85}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{all:unset; cursor:pointer; padding:9px 16px 8px; border-radius:99px; border:1.5px solid var(--ink); font-size:11px; letter-spacing:.18em; text-transform:uppercase; font-weight:600}
.chip.on{background:var(--ink); color:var(--bg)}

/* product page */
.pdp{display:grid; grid-template-columns:1.05fr 1fr; gap:clamp(24px,5vw,80px); padding-top:clamp(24px,4vh,50px)}
.pdp-media{position:sticky; top:84px; align-self:start; display:grid; gap:10px}
.pdp-main{position:relative; overflow:hidden; background:radial-gradient(circle at 50% 60%, #fff 0, var(--card) 70%); border-radius:var(--r); aspect-ratio:1}
.pdp-main img{position:absolute; inset:10%; width:80%; height:80%; max-width:none; object-fit:contain; filter:drop-shadow(0 30px 26px rgba(0,0,0,.18))}
.pdp-mood{border-radius:var(--r); overflow:hidden; aspect-ratio:16/9}
.pdp-mood img{width:100%; height:100%; object-fit:cover}
.pdp h1{font-size:clamp(38px,5vw,76px); line-height:.9; margin:10px 0 6px}
.pdp .tag{font-family:var(--f-big); text-transform:uppercase; font-size:clamp(18px,1.8vw,24px); margin:0 0 18px}
.pdp .buy{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:18px 0; border-block:1px solid var(--line); margin:22px 0}
.pdp .buy b{font-family:var(--f-big); font-size:28px; font-weight:400}
.acc{border-bottom:1px solid var(--line)}
.acc summary{cursor:pointer; list-style:none; display:flex; justify-content:space-between; padding:16px 0; font-size:11.5px; letter-spacing:.22em; text-transform:uppercase; font-weight:600}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+"; font-size:18px; line-height:1}
.acc[open] summary::after{content:"–"}
.acc .ab{padding:0 0 18px}
.acc ul{margin:0; padding-left:18px}
.step-pill{display:inline-flex; gap:8px; align-items:center; padding:7px 12px 6px; border-radius:99px; background:var(--ink); color:var(--bg); font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; font-weight:600}
.back-link{all:unset; cursor:pointer; font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; font-weight:600}
@media (max-width:860px){ .pdp{grid-template-columns:1fr} .pdp-media{position:static} }

/* routine builder */
.rb{display:grid; grid-template-columns:1fr 1.1fr; gap:clamp(24px,4vw,70px); align-items:start}
.rb h1{font-size:clamp(48px,8vw,140px); line-height:.84}
.rb-q{background:var(--card); border-radius:var(--r); padding:clamp(20px,3vw,40px)}
.rb-q h2{font-size:clamp(22px,2.2vw,32px); margin-bottom:6px}
.rb-q .chips{margin:16px 0 22px}
.time{display:flex; gap:8px; margin:14px 0 24px}
.steps{list-style:none; padding:0; margin:0; display:grid; gap:10px}
.steps li{display:grid; grid-template-columns:64px 72px 1fr auto; gap:14px; align-items:center; background:var(--card); border-radius:18px; padding:12px 16px 12px 18px}
.steps li.empty{opacity:.45}
.steps .sn{font-family:var(--f-big); font-size:26px}
.steps .si{width:72px; height:72px; display:grid; place-items:center; background:#fff; border-radius:12px; overflow:hidden}
.steps .si img{width:86%; height:86%; object-fit:contain}
.steps h4{margin:0; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--mute); font-weight:600}
.steps b{display:block; font-weight:600; font-size:15px}
.steps small{color:var(--mute)}
.rb-sum{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-top:18px}
.rb-sum b{font-family:var(--f-big); font-size:24px; font-weight:400}
@media (max-width:860px){ .rb{grid-template-columns:1fr} .steps li{grid-template-columns:44px 60px 1fr; } .steps li .btn{grid-column:1 / -1} .steps .si{width:60px; height:60px} }

/* why */
.why h1{font-size:clamp(48px,9vw,160px); line-height:.84}
.why .lead{font-size:clamp(20px,2vw,28px); max-width:820px; margin:24px 0 0; line-height:1.35}

/* newsletter + footer */
.news{background:var(--ink); color:var(--bg); border-radius:var(--r); display:grid; grid-template-columns:1fr 1fr; overflow:hidden}
.news .ph img{width:100%; height:100%; object-fit:cover}
.news .nt{padding:clamp(24px,4vw,60px)}
.news h2{font-size:clamp(44px,6vw,96px)}
.news form{display:grid; gap:12px; margin-top:22px; max-width:420px}
.news input{all:unset; border-bottom:1.5px solid rgba(233,231,227,.5); padding:12px 2px; font-size:16px}
.news input::placeholder{color:rgba(233,231,227,.55); letter-spacing:.14em; text-transform:uppercase; font-size:12px}
.news .btn{border-color:var(--bg); color:var(--bg); justify-self:start; margin-top:8px}
.news .btn:hover{background:var(--bg); color:var(--ink)}
@media (max-width:760px){ .news{grid-template-columns:1fr} .news .ph{aspect-ratio:16/10} }
.ft{padding:44px 0 30px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}
.ft .logo{font-size:clamp(70px,16vw,260px); line-height:.8; width:100%}
.concept{font-size:12px; color:var(--mute); max-width:520px}

/* cart drawer */
.scrim{position:fixed; inset:0; z-index:60; background:rgba(13,13,13,.35); opacity:0; pointer-events:none; transition:opacity .3s}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{position:fixed; z-index:61; top:0; right:0; bottom:0; width:min(440px,100vw); background:var(--bg); translate:100% 0; transition:translate .4s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column}
.drawer.open{translate:0 0}
.dr-h{display:flex; justify-content:space-between; align-items:center; padding:20px 22px; border-bottom:1px solid var(--line)}
.dr-h h2{font-size:22px}
.dr-x{all:unset; cursor:pointer; font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; font-weight:600}
.dr-b{flex:1; overflow-y:auto; padding:10px 22px}
.ci{display:grid; grid-template-columns:70px 1fr auto; gap:14px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line)}
.ci .si{width:70px; height:70px; background:var(--card); border-radius:12px; display:grid; place-items:center; overflow:hidden}
.ci .si img{width:86%; height:86%; object-fit:contain}
.ci b{font-size:14px; font-weight:600}
.qty{display:inline-flex; align-items:center; gap:10px; margin-top:6px}
.qty button{all:unset; cursor:pointer; width:26px; height:26px; border-radius:50%; border:1px solid var(--ink); display:grid; place-items:center; font-size:14px}
.dr-f{padding:18px 22px 24px; border-top:1px solid var(--line); display:grid; gap:12px}
.dr-f .tot{display:flex; justify-content:space-between; font-family:var(--f-big); font-size:22px}
.empty-cart{padding:40px 0; text-align:center; color:var(--mute)}
.toast{position:fixed; z-index:70; left:50%; bottom:22px; translate:-50% 200%; opacity:0; background:var(--ink); color:var(--bg); padding:13px 20px 12px; border-radius:99px; font-size:11.5px; letter-spacing:.18em; text-transform:uppercase; font-weight:600; transition:translate .4s; white-space:nowrap}
.toast.on{translate:-50% 0; opacity:1}

/* reveal */
.rv{opacity:0; translate:0 24px; transition:opacity .8s, translate 1s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1; translate:0 0}
@media (prefers-reduced-motion: reduce){ .rv{opacity:1; translate:none; transition:none} .marq-in{animation:none} html{scroll-behavior:auto} }
</style>
</head>
<body>
<header class="hd">
  <div class="wrap hd-in">
    <nav class="l" aria-label="Main">
      <a class="n" href="#/routine">My routine</a><a class="n" href="#/why">Why RAW?</a><a class="n" href="#/shop">Shop</a>
    </nav>
    <button class="burger" id="burger" aria-expanded="false" aria-controls="mnav">Menu</button>
    <a class="logo" href="#/" aria-label="RAW. home">RAW.</a>
    <nav class="r" aria-label="Secondary">
      <a class="n" href="#/collection">The collection</a>
      <button class="n cart" id="cartBtn" type="button">Cart<span class="count" id="count">0</span></button>
    </nav>
  </div>
</header>
<nav class="mnav" id="mnav" aria-label="Mobile">
  <a href="#/shop">Shop</a><a href="#/collection">The collection</a><a href="#/routine">My routine</a><a href="#/why">Why RAW?</a>
</nav>

<main id="app"></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Cart" aria-hidden="true">
  <div class="dr-h"><h2>Your cart</h2><button class="dr-x" id="drX" type="button">Close ✕</button></div>
  <div class="dr-b" id="drB"></div>
  <div class="dr-f" id="drF"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const D = DATA, $ = id => document.getElementById(id), app = $('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => D.currency + (Math.round(n * 100) / 100).toFixed(n % 1 ? 2 : 0);
  const ALL = [...D.core.map(p => ({ ...p, cat: 'Skincare', core: true })), ...D.more];
  const byId = id => ALL.find(p => p.id === id);
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* storage (optional — the site works without it) */
  const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };
  let cart = store.get('raw-cart', {});
  let routine = store.get('raw-routine', { feel: [], time: 'am' });

  /* ── views ── */
  const card = p => `<article class="pcard rv" tabindex="0" role="link" data-go="#/p/${esc(p.id)}" aria-label="${esc(p.name)}">
      ${p.no ? `<span class="no">${esc(p.no)}</span>` : ''}
      <div class="pi"><img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy"></div>
      <div class="pt"><h3>${esc(p.short || p.name)}</h3><span class="pr">${money(p.price)}</span></div>
      <p>${esc(p.tag || p.text)}</p>
      <button type="button" class="btn sm add" data-add="${esc(p.id)}">Add to cart</button>
    </article>`;

  const marq = items => `<div class="marq" aria-hidden="true"><div class="marq-in">${(items.map(t => `<span>${esc(t)}</span>`).join('')).repeat(4)}</div></div>`;

  const news = () => `<section class="sec" style="padding-top:0"><div class="wrap"><div class="news rv">
      <div class="ph"><img src="img/face-dropper.jpg" alt="" loading="lazy"></div>
      <div class="nt"><span class="cap" style="opacity:.6">Newsletter</span><h2>Stay RAW.</h2><p>Product drops, skin notes and things worth knowing.</p>
        <form id="newsF"><input name="name" placeholder="Name" autocomplete="name" aria-label="Name"><input name="email" type="email" placeholder="Email" autocomplete="email" aria-label="Email" required>
        <button class="btn" type="submit">Sign up</button></form></div>
    </div></div></section>`;

  const foot = () => `<footer class="wrap ft"><span class="logo">RAW.</span>
      <span class="cap">Skincare, stripped back.</span>
      <p class="concept">RAW. is a concept brand designed by Emma Neznikova: brand, packaging and website design. Product mockups were generated with AI. No real products are sold here.</p></footer>`;

  function home() {
    return `<section class="hero wrap">
        <div class="hero-t">
          <h1>Skincare,<br>stripped back.</h1>
          <div><p>High-performance formulas. Sculptural objects. Nothing unnecessary.</p><a class="btn fill" href="#/collection">To the collection →</a></div>
        </div>
        <div class="hero-img"><img src="img/hero.jpg" alt="The RAW. collection: chrome bottles and a cloud-shaped cream jar on a silver plinth"></div>
      </section>
      <div style="height:clamp(30px,5vh,60px)"></div>${marq(['Just skin', 'Formula', 'Object', 'No ten-step routine', 'No complicated language'])}
      <section class="sec"><div class="wrap split">
        <div class="ph rv"><img src="img/logo-cream.jpg" alt="RAW. logo pressed into thick cream" loading="lazy"></div>
        <div class="rv"><span class="cap mute">The idea behind RAW.</span>
          <h2>Made to be seen, not hidden.</h2>
          <p>Most skincare brands ask you to hide their products inside a bathroom cabinet. RAW. was designed to do the opposite.</p>
          <p>Every object is made to live visibly: on a bedside table, next to jewellery, on a chrome tray. The packaging takes cues from liquid metal, glass and lab equipment, while the formulas inside stay soft and sensorial.</p>
          <div class="contrast"><span>Hard outside</span><span>/</span><span>Soft inside</span><span>Metal</span><span>/</span><span>Cream</span><span>Technology</span><span>/</span><span>Touch</span></div>
          <a class="btn" href="#/why">More about RAW.</a></div>
      </div></section>
      <section class="sec" style="padding-top:0"><div class="wrap">
        <div class="shop-h"><div><span class="cap mute">The collection</span><h2 style="font-size:clamp(40px,6vw,96px);margin-top:10px">Six formulas.</h2></div><a class="btn" href="#/collection">See all →</a></div>
        <div class="grid g3">${D.core.map(card).join('')}</div>
      </div></section>
      <section class="sec" style="padding-top:0"><div class="wrap"><h2 class="big-line rv">Your skin is not<br>a problem <em>to solve.</em></h2></div></section>
      <section class="sec" style="padding-top:0"><div class="wrap split rev">
        <div class="rv"><span class="cap mute">The routine</span><h2>Build less. Get more.</h2>
          <p>Four steps. No complicated routine. Tell us how your skin feels today and we'll build your routine from the collection.</p>
          <ol class="steps" style="margin:22px 0 26px">${D.routine.slice(1, 5).map(s => `<li style="grid-template-columns:56px 1fr"><span class="sn">${s.n}</span><div><b>${esc(s.title)}</b><small>${esc(s.hint)}</small></div></li>`).join('')}</ol>
          <a class="btn fill" href="#/routine">Build my routine →</a></div>
        <div class="ph rv"><img src="img/spatulas.jpg" alt="Five metal spatulas with different creams and gels" loading="lazy"></div>
      </div></section>
      <section class="sec" style="padding-top:0"><div class="wrap">
        <span class="cap mute">The RAW. philosophy</span>
        <h2 style="font-size:clamp(40px,6vw,96px);margin-top:10px">Fewer products.<br>More purpose.</h2>
        <div class="philo">
          <article class="rv"><h3>Fewer products</h3><p>A good routine doesn't need twelve products. Every RAW. formula has one clear role. Layer what your skin needs. Skip what it doesn't.</p></article>
          <article class="rv"><h3>Texture matters</h3><p>Skincare should feel as good as it performs. Gel-serums that disappear, creams with a dense, whipped slip, oils that glow without grease.</p></article>
          <article class="rv"><h3>Formula first</h3><p>Proven ingredients: humectants for hydration, emollients for softness, lipids for the barrier, antioxidants and peptides.</p></article>
        </div>
      </div></section>
      <section class="sec" style="padding-top:0"><div class="wrap mood">
        ${['tray.jpg', 'bottles-1.jpg', 'swirls.jpg', 'texture-drop.jpg', 'bottles-2.jpg', 'texture-foam.jpg', 'drip.jpg'].map(i => `<div class="rv"><img src="img/${i}" alt="" loading="lazy"></div>`).join('')}
      </div></section>
      ${news()}${foot()}`;
  }

  let filter = 'All';
  function shop(title = 'The RAW. collection') {
    const cats = ['All', 'Skincare', 'Objects'];
    const list = ALL.filter(p => filter === 'All' || p.cat === filter);
    return `<section class="sec" style="padding-top:clamp(30px,6vh,70px)"><div class="wrap">
        <div class="shop-h"><h1>${title.replace(' ', '<br>')}</h1>
          <div class="chips" role="tablist">${cats.map(c => `<button type="button" class="chip${c === filter ? ' on' : ''}" data-filter="${c}" role="tab" aria-selected="${c === filter}">${c}</button>`).join('')}</div></div>
        <div class="grid">${list.map(card).join('')}</div>
      </div></section>
      <section class="sec" style="padding-top:0"><div class="wrap split">
        <div class="ph rv"><img src="img/lighter-candle.jpg" alt="A chrome RAW. lighter lighting a ceramic candle" loading="lazy"></div>
        <div class="rv"><span class="cap mute">Objects</span><h2>The final touch.</h2><p>A sleek chrome essential designed to live beside your skincare, candle and bedside objects.</p>
          <button type="button" class="btn fill" data-add="lighter">Add RAW. Lighter · ${money(byId('lighter').price)}</button></div>
      </div></section>${news()}${foot()}`;
  }

  function pdp(id) {
    const p = byId(id); if (!p) return home();
    const acc = (t, body, open) => `<details class="acc"${open ? ' open' : ''}><summary>${t}</summary><div class="ab">${body}</div></details>`;
    const step = D.routine.find(s => s.key === p.step);
    const others = D.core.filter(x => x.id !== p.id).slice(0, 4);
    return `<section class="wrap" style="padding-top:20px"><a class="back-link" href="#/collection">← The collection</a></section>
      <section class="wrap pdp">
        <div class="pdp-media"><div class="pdp-main"><img src="${esc(p.image)}" alt="${esc(p.name)}"></div>
          ${p.mood ? `<div class="pdp-mood"><img src="${esc(p.mood)}" alt="Texture of ${esc(p.name)}" loading="lazy"></div>` : ''}</div>
        <div>
          ${p.no ? `<span class="cap mute">${esc(p.no)} — ${step ? `step ${esc(step.n)} · ${esc(step.title)}` : 'Extra care'}</span>` : `<span class="cap mute">${esc(p.cat)}</span>`}
          <h1>${esc(p.name)}</h1>
          ${p.tag ? `<p class="tag">${esc(p.tag)}</p>` : ''}
          <p style="font-size:18px">${esc(p.text)}</p>
          <div class="buy"><b>${money(p.price)}</b>${p.size ? `<span class="mute">${esc(p.size)}</span>` : ''}
            <button type="button" class="btn fill" data-add="${esc(p.id)}">Add to cart</button>
            ${p.core && p.step !== 'extra' ? `<a class="btn" href="#/routine">See it in my routine</a>` : ''}</div>
          ${p.does ? acc('What it does', `<ul>${p.does.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`, true) : ''}
          ${p.texture ? acc('Texture', `<p style="margin:0">${esc(p.texture)}</p>`) : ''}
          ${p.use ? acc('How to use', `<p style="margin:0">${esc(p.use)}</p>`) : ''}
          ${p.ingredients ? acc('Key ingredients', `<ul>${p.ingredients.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`) : ''}
          ${p.line ? `<p class="cap" style="margin-top:26px">${esc(p.line)}</p>` : ''}
        </div>
      </section>
      <section class="sec"><div class="wrap"><div class="shop-h"><h2 style="font-size:clamp(30px,4vw,60px)">Works well with</h2></div>
        <div class="grid">${others.map(card).join('')}</div></div></section>${foot()}`;
  }

  /* routine: pick how your skin feels → best product per step */
  function buildRoutine() {
    const f = routine.feel;
    const pick = key => {
      const c = ALL.filter(p => p.step === key);
      if (!c.length) return null;
      if (key === 'target') { const hits = c.filter(p => (p.skin || []).some(s => f.includes(s))); return hits.length ? hits : null; }
      if (key === 'seal') return (f.includes('dry') || routine.time === 'pm') ? c : null;
      return c;
    };
    return D.routine.map(s => ({ ...s, items: pick(s.key) || [] }));
  }
  function routinePage() {
    const steps = buildRoutine();
    const items = steps.flatMap(s => s.items);
    const total = items.reduce((t, p) => t + p.price, 0);
    const mask = routine.feel.some(x => ['stressed', 'dry', 'tight'].includes(x));
    return `<section class="sec" style="padding-top:clamp(30px,6vh,70px)"><div class="wrap rb">
        <div><span class="cap mute">My routine</span><h1 style="margin-top:12px">Build less.<br>Get more.</h1>
          <p style="font-size:18px;max-width:440px;margin-top:22px">Your skin doesn't need ten steps. It needs the right ones. Tell us how it feels today.</p></div>
        <div>
          <div class="rb-q">
            <h2>How does your skin feel today?</h2><p class="mute" style="margin:0">Pick everything that fits.</p>
            <div class="chips">${D.feelings.map(x => `<button type="button" class="chip${routine.feel.includes(x.key) ? ' on' : ''}" data-feel="${x.key}" aria-pressed="${routine.feel.includes(x.key)}">${esc(x.label)}</button>`).join('')}</div>
            <h2>Morning or night?</h2>
            <div class="time">${[['am', 'Morning'], ['pm', 'Night']].map(([k, l]) => `<button type="button" class="chip${routine.time === k ? ' on' : ''}" data-time="${k}" aria-pressed="${routine.time === k}">${l}</button>`).join('')}</div>
            <ol class="steps">${steps.map(s => s.items.length ? s.items.map(p => `<li>
                <span class="sn">${s.n}</span><div class="si"><img src="${esc(p.image)}" alt=""></div>
                <div><h4>${esc(s.title)} · ${esc(s.hint)}</h4><b>${esc(p.name)}</b><small>${esc(p.use || p.text || '')}</small></div>
                <a class="btn sm" href="#/p/${esc(p.id)}">View</a></li>`).join('')
              : `<li class="empty"><span class="sn">${s.n}</span><div class="si"></div><div><h4>${esc(s.title)}</h4><b>Skip it today</b><small>${s.key === 'target' ? 'Nothing to target. Good.' : 'Your skin doesn\'t need it right now.'}</small></div></li>`).join('')}</ol>
            ${mask ? `<p class="mute" style="margin:16px 0 0">Extra tip: on stressed days, swap step 04 for the <a href="#/p/mask" style="text-decoration:underline">Cream Mask</a> once a week.</p>` : ''}
            <div class="rb-sum"><span>${items.length} products · <b>${money(total)}</b></span><button type="button" class="btn fill" data-addall="${items.map(p => p.id).join(',')}">Add my routine to cart</button></div>
          </div>
        </div>
      </div></section>${foot()}`;
  }

  function why() {
    return `<section class="sec why" style="padding-top:clamp(30px,6vh,70px)"><div class="wrap">
        <span class="cap mute">Why RAW.?</span><h1 style="margin-top:12px">Because skincare<br>became too<br>complicated.</h1>
        <p class="lead rv">Somewhere between fifteen-step routines, ingredient trends and algorithm-approved miracle products, skincare stopped feeling simple. RAW. is an attempt to remove the performance around it.</p>
      </div></section>
      <section class="sec" style="padding-top:0"><div class="wrap split">
        <div class="ph rv"><img src="img/tray-travel.jpg" alt="A tray with headphones, passport, sunglasses and RAW. products" loading="lazy"></div>
        <div class="rv"><h2>Understand it. Don't fix it.</h2>
          <p>We don't want you constantly fixing your skin. We want you to understand it.</p>
          <p>Hydrate when it's dehydrated. Repair when it's stressed. Nourish when it's dry. Leave it alone when it's good. Give your skin what it needs. Nothing more.</p>
          <a class="btn fill" href="#/routine">Build my routine →</a></div>
      </div></section>
      ${marq(['Less correction', 'More connection', 'Skin', 'Formula', 'Object'])}
      <section class="sec"><div class="wrap split rev">
        <div class="rv"><h2>Hard outside. Soft inside.</h2><p>Mirror-finish chrome next to milky creams and translucent gels. Packaging inspired by liquid metal, glass and laboratory equipment, so the products become part of your space, not something to hide.</p></div>
        <div class="ph rv"><img src="img/labels.jpg" alt="Three RAW. product labels" loading="lazy"></div>
      </div></section>${news()}${foot()}`;
  }

  /* ── router ── */
  function render() {
    const h = location.hash.replace(/^#\/?/, '');
    const [page, arg] = h.split('/');
    app.innerHTML = page === 'shop' ? shop('The RAW. collection') : page === 'collection' ? shop('The collection') : page === 'p' ? pdp(arg) : page === 'routine' ? routinePage() : page === 'why' ? why() : home();
    document.querySelectorAll('.hd a.n').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#/' + page));
    $('mnav').classList.remove('open'); $('burger').setAttribute('aria-expanded', 'false');
    const p = page === 'p' && byId(arg);
    document.title = p ? `${p.name} — RAW.` : 'RAW. — Skincare, stripped back';
    reveal(); window.scrollTo(0, 0);
  }
  addEventListener('hashchange', render);

  let io;
  function reveal() {
    const els = app.querySelectorAll('.rv');
    if (RM || !('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
    io?.disconnect();
    io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -6% 0px', threshold: .05 });
    els.forEach(e => io.observe(e));
  }

  /* ── cart ── */
  const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); };
  function saveCart() { store.set('raw-cart', cart); drawCart(); }
  function add(id, n = 1) { cart[id] = (cart[id] || 0) + n; if (cart[id] <= 0) delete cart[id]; saveCart(); const c = $('count'); c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
  function drawCart() {
    const ids = Object.keys(cart).filter(byId);
    const n = ids.reduce((t, i) => t + cart[i], 0), tot = ids.reduce((t, i) => t + cart[i] * byId(i).price, 0);
    $('count').textContent = n;
    $('drB').innerHTML = ids.length ? ids.map(i => { const p = byId(i); return `<div class="ci"><div class="si"><img src="${esc(p.image)}" alt=""></div>
        <div><b>${esc(p.name)}</b><div class="qty"><button type="button" data-q="${i}" data-d="-1" aria-label="One less">−</button><span>${cart[i]}</span><button type="button" data-q="${i}" data-d="1" aria-label="One more">+</button></div></div>
        <span>${money(cart[i] * p.price)}</span></div>`; }).join('') : `<p class="empty-cart">Your cart is empty.<br>Less is more, but not that much less.</p>`;
    $('drF').innerHTML = ids.length ? `<div class="tot"><span>Total</span><span>${money(tot)}</span></div><button type="button" class="btn fill" id="checkout">Checkout</button><p class="mute" style="margin:0;font-size:12px">RAW. is a concept brand. Checkout is a demo.</p>` : `<a class="btn" href="#/collection" id="toShop">Shop the collection</a>`;
  }
  const openCart = o => { $('drawer').classList.toggle('open', o); $('scrim').classList.toggle('open', o); $('drawer').setAttribute('aria-hidden', String(!o)); if (o) $('drX').focus(); };
  $('cartBtn').addEventListener('click', () => openCart(true));
  $('drX').addEventListener('click', () => openCart(false));
  $('scrim').addEventListener('click', () => openCart(false));
  addEventListener('keydown', e => { if (e.key === 'Escape') openCart(false); });

  document.addEventListener('click', e => {
    const a = e.target.closest('[data-add]');
    if (a) { e.preventDefault(); e.stopPropagation(); add(a.dataset.add); a.classList.add('added'); a.textContent = 'Added ✓'; toast(byId(a.dataset.add).name + ' added'); return; }
    const all = e.target.closest('[data-addall]');
    if (all) { all.dataset.addall.split(',').filter(Boolean).forEach(i => add(i)); toast('Routine added to cart'); openCart(true); return; }
    const q = e.target.closest('[data-q]'); if (q) { add(q.dataset.q, +q.dataset.d); return; }
    if (e.target.closest('#checkout')) { toast('Thanks! This is a concept: no real order placed'); return; }
    if (e.target.closest('#toShop')) { openCart(false); return; }
    const f = e.target.closest('[data-filter]'); if (f) { filter = f.dataset.filter; const y = scrollY; render(); scrollTo(0, y); return; }
    const fl = e.target.closest('[data-feel]'); if (fl) { const k = fl.dataset.feel; routine.feel = routine.feel.includes(k) ? routine.feel.filter(x => x !== k) : [...routine.feel, k]; store.set('raw-routine', routine); const y = scrollY; render(); scrollTo(0, y); return; }
    const tm = e.target.closest('[data-time]'); if (tm) { routine.time = tm.dataset.time; store.set('raw-routine', routine); const y = scrollY; render(); scrollTo(0, y); return; }
    const g = e.target.closest('[data-go]'); if (g && !e.target.closest('a,button')) { location.hash = g.dataset.go; }
  });
  document.addEventListener('keydown', e => { const g = e.target.closest?.('[data-go]'); if (g && (e.key === 'Enter' || e.key === ' ') && e.target === g) { e.preventDefault(); location.hash = g.dataset.go; } });
  document.addEventListener('submit', e => { if (e.target.id === 'newsF') { e.preventDefault(); e.target.innerHTML = '<p style="margin:0">Welcome to RAW. ✓<br><small style="opacity:.6">(Concept site: nothing was sent.)</small></p>'; } });
  $('burger').addEventListener('click', () => { const o = $('mnav').classList.toggle('open'); $('burger').setAttribute('aria-expanded', String(o)); });

  drawCart(); render();
})();
</script>
</body>
</html>
